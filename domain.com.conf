# Rate limiting zones — add these once to /etc/nginx/nginx.conf inside http {}:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    server_name  stream.purplemerit.shop;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options  "nosniff"                            always;
    add_header X-XSS-Protection        "1; mode=block"                      always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ── Upload size — video files up to 2 GB ─────────────────────────────────
    client_max_body_size   2048m;
    client_body_timeout    300s;
    client_header_timeout  30s;
    send_timeout           300s;
    proxy_read_timeout     300s;
    proxy_send_timeout     300s;
    proxy_connect_timeout  10s;

    # ── Socket.io — WebSocket upgrade ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
            #limit_req  zone=api_limit burst=30 nodelay;
            #limit_conn conn_limit 20;

        proxy_pass              http://127.0.0.1:5020;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        proxy_request_buffering off;
    }

    # ── Frontend (React SPA via Docker container) ─────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stream.purplemerit.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stream.purplemerit.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}



server {
    if ($host = stream.purplemerit.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name  stream.purplemerit.shop;
    return 404; # managed by Certbot


}